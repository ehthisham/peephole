project: peephole
gitHost: bitbucket
stateBranch: peephole-state
remote: git@bitbucket.org:ehthishamtk/peephole.git
states:
  - proposed
  - in-progress
  - built
  - verified
  - shipped
  - closed
control:
  - run
  - pause
  - skip
  - restart
risk:
  - reversible
  - irreversible
# Gated transitions: moving a ticket into "shipped" (from "verified") records a review stamp.
gates:
  - verified->shipped
